name: Release

on:
  workflow_dispatch: # possibilità di avviare il workflow manualmente Actions / Release / Run workflow
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      ARTIFACT_NAME: "timbrapp-extension"
      CHROME_EXTENSION_ID: "dhpcliknphfdbocmcgfgepbkjmdklbgg"
      MINIFY_VERSION: "v2.21.3"
      # Da ricalcolare (es. via checksums.txt pubblicato dal progetto) ogni volta che si alza MINIFY_VERSION
      MINIFY_SHA256: "a5ee60de8d3e2b98d20c6fad047bb3e2c162e1d0b56a5f474f773a651a23494e"

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Install Pandoc
        id: install-pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Generate README.html
        id: generate-readme
        run: sh utils/generate-readme-html.sh

      - name: Package
        id: package
        run: |
          mv src $ARTIFACT_NAME
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Scrive la versione reale (dal tag) in manifest.json e rimuove il placeholder "version_name": "dev"
            VERSION="${GITHUB_REF_NAME#v}"
            jq --arg v "$VERSION" '.version = $v | del(.version_name)' $ARTIFACT_NAME/manifest.json > /tmp/manifest.json
            mv /tmp/manifest.json $ARTIFACT_NAME/manifest.json
          fi
          cp LICENSE NOTICE $ARTIFACT_NAME
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Minifying files..."
            curl -sLO "https://github.com/tdewolff/minify/releases/download/${MINIFY_VERSION}/minify_linux_amd64.tar.gz"
            echo "${MINIFY_SHA256}  minify_linux_amd64.tar.gz" | sha256sum -c -
            tar -xzf minify_linux_amd64.tar.gz
            chmod +x ./minify
            ./minify -r -o $ARTIFACT_NAME/ $ARTIFACT_NAME/
            # NOTE skip json # find $ARTIFACT_NAME/ -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" \) -exec ./minify -o {} {} \;
          else
            echo "Skipping minification..."
          fi
          # Il nome del file zip include il tag in release, ma la cartella al suo interno resta
          # sempre "timbrapp-extension" (non cambia nulla per chi lo estrae e carica in Chrome).
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ZIP_NAME="$ARTIFACT_NAME-${{ github.ref_name }}"
          else
            ZIP_NAME="$ARTIFACT_NAME"
          fi
          zip -r "$ZIP_NAME.zip" "$ARTIFACT_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Release
        id: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') # Esegui solo se è un tag
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: TimbrApp Extension ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ./${{ steps.package.outputs.zip_name }}.zip

      - name: Upload on Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        if: startsWith(github.ref, 'refs/tags/v') # Esegui solo se è un tag
        with:
          file-path: ./${{ steps.package.outputs.zip_name }}.zip
          extension-id: ${{ env.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true # true pubblica subito e richiede automaticamente la revisione / false solo per bozza da approvare manualmente sulla dev console di chrome
